spring:
    application:
        name: "spring-ai-help-desk"
    datasource:
        url: jdbc:postgresql://localhost:5432/postgres
        username: postgres
        password: password
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
    ai:
        openai:
            api-key: ${OPENAI_API_KEY}
            chat:
                options:
                    model: gpt-4o-mini

        chat:
            memory:
                repository:
                    jdbc:
                        initialize-schema: always

logging:
    level:
        org:
            springframework:
                ai:
                    chat:
                        client:
                            advisor: DEBUG

another:
    student: true
