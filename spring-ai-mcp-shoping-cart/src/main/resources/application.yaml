spring:
    application:
        name: spring-ai-mcp-shoping-cart
    datasource:
        url: jdbc:postgresql://localhost:5432/postgres
        username: postgres
        password: password
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
    ai:
        mcp:
            server:
                name: shopping-cart-mcp-server
                version: 1.0.0
