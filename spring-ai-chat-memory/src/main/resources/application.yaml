spring:
    ai:
        openai:
            api-key: ${OPENAI_API_KEY}
        chat:
            memory:
                repository:
                    jdbc:
                        initialize-schema: ALWAYS
    application:
        name: spring-ai-chat-memory
    datasource:
        url: jdbc:postgresql://localhost:5432/postgres
        username: postgres
        password: password
    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
    level:
        org.springframework:
            ai:
                chat:
                    client:
                        advisor: DEBUG
